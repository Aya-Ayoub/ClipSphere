version: "3.9"

# ── ClipSphere – Phase 4: Full Multi-Container Orchestration ─────────────────
# Launch everything with a single command:
#   docker-compose up --build
#
# Services:
#   A) frontend  – Next.js  (port 3000 internal)
#   B) backend   – Express  (port 5000 internal)
#   C) worker    – BullMQ email worker (same image as backend, different CMD)
#   D) mongodb   – MongoDB 7
#   E) minio     – MinIO object storage
#   F) redis     – Redis 7
#   G) nginx     – Reverse proxy / gateway (port 80 + 443 exposed to host)

services:

  # ── A: Next.js Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clipsphere_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://nginx/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://nginx
    depends_on:
      - backend
    networks:
      - clipsphere_net
    # NOT exposed directly – traffic comes through Nginx

  # ── B: Express API Backend ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clipsphere_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/clipsphere
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_changeme_in_prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-clipsphere-videos}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.mailtrap.io}
      EMAIL_PORT: ${EMAIL_PORT:-2525}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@clipsphere.local}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - clipsphere_net
    volumes:
      - uploads_data:/app/uploads

  # ── C: BullMQ Email Worker ────────────────────────────────────────────────
  # Runs the same Docker image as the backend but executes worker.js instead.
  # This keeps heavy email processing off the main API thread.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clipsphere_worker
    restart: unless-stopped
    command: ["node", "worker.js"]
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/clipsphere
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EMAIL_HOST: ${EMAIL_HOST:-smtp.mailtrap.io}
      EMAIL_PORT: ${EMAIL_PORT:-2525}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@clipsphere.local}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clipsphere_net

  # ── D: MongoDB ────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: clipsphere_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - clipsphere_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Not exposed to host in production – backend connects via internal DNS

  # ── E: MinIO Object Storage ───────────────────────────────────────────────
  minio:
    image: minio/minio
    container_name: clipsphere_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - clipsphere_net
    # Console accessible via Nginx at /storage or directly on :9001 for dev
    ports:
      - "9001:9001"   # MinIO console (dev convenience)

  # ── F: Redis ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: clipsphere_redis
    restart: unless-stopped
    command: redis-server --appendonly yes   # enable AOF persistence
    volumes:
      - redis_data:/data
    networks:
      - clipsphere_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── G: Nginx Reverse Proxy ────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: clipsphere_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
      - minio
    networks:
      - clipsphere_net
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro   # self-signed certs (generated by script)

# ── Persistent Volumes ────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

# ── Internal Network ──────────────────────────────────────────────────────────
networks:
  clipsphere_net:
    driver: bridge
# ── ClipSphere – Nginx Reverse Proxy Configuration ───────────────────────────
#
# Routing:
#   localhost/          → Next.js frontend container
#   localhost/api       → Express backend container
#   localhost/api-docs  → Swagger UI (served by Express)
#   localhost/socket.io → Socket.io (Express backend)
#   localhost/storage   → MinIO object storage
#
# All HTTP traffic is redirected to HTTPS (self-signed cert for local dev).

# ── Upstream services (internal Docker DNS names) ─────────────────────────────
upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream backend_upstream {
    server backend:5000;
    keepalive 32;
}

upstream minio_upstream {
    server minio:9000;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name localhost clipsphere.local;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# ── Main HTTPS server block ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name localhost clipsphere.local;

    # ── SSL (self-signed, generated by generate-certs.sh) ────────────────────
    ssl_certificate     /etc/nginx/certs/clipsphere.crt;
    ssl_certificate_key /etc/nginx/certs/clipsphere.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Client body size (for video uploads) ─────────────────────────────────
    client_max_body_size 210M;

    # ── Timeouts (important for large video uploads) ──────────────────────────
    proxy_connect_timeout   60s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;

    # ── Common proxy headers ──────────────────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ─────────────────────────────────────────────────────────────────────────
    # 1. API routes → Express backend
    # ─────────────────────────────────────────────────────────────────────────
    location /api {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Needed for Stripe webhook raw body
        proxy_request_buffering off;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 2. Swagger docs → Express backend
    # ─────────────────────────────────────────────────────────────────────────
    location /api-docs {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 3. Socket.io → Express backend (WebSocket upgrade)
    # ─────────────────────────────────────────────────────────────────────────
    location /socket.io {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Socket.io long-polling needs longer timeouts
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 4. Health check endpoint (public)
    # ─────────────────────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 5. MinIO storage → MinIO container
    # ─────────────────────────────────────────────────────────────────────────
    location /storage {
        rewrite ^/storage/?(.*) /$1 break;
        proxy_pass http://minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";

        # Large video downloads need longer timeouts
        proxy_read_timeout 300s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 6. Next.js static assets – served directly by Nginx
    #    This offloads static file serving from the Next.js container.
    # ─────────────────────────────────────────────────────────────────────────
    location /_next/static {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        # Aggressive caching for hashed static assets
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_cache_valid 200 1y;
    }

    location /favicon.ico {
        proxy_pass http://frontend_upstream;
        add_header Cache-Control "public, max-age=86400";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # 7. Everything else → Next.js frontend
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        # Required for Next.js HMR websockets in development
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # No cache for HTML pages (SSR)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}